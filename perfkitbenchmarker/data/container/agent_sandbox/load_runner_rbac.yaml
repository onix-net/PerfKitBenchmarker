apiVersion: v1
kind: ServiceAccount
metadata:
  name: load-runner
  namespace: agent-sandbox-bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: load-runner
  namespace: agent-sandbox-bench
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: load-runner
  namespace: agent-sandbox-bench
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: load-runner
subjects:
  - kind: ServiceAccount
    name: load-runner
    namespace: agent-sandbox-bench
